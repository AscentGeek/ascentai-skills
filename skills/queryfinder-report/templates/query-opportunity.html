<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{REPORT_TITLE}} · {{CATEGORY}}</title>
  <link href="{{FONT_HREF}}" rel="stylesheet">
  <style>{{INLINED_CSS}}</style>
</head>
<body class="view-mode-dash">

  <div class="mini-toolbar">
    <div class="mini-toolbar__view">
      <button type="button" data-view="dash" class="active">{{TOOLBAR_DASH_BTN}}</button>
      <button type="button" data-view="a4">{{TOOLBAR_A4_LABEL}}</button>
    </div>
    {{TOOLBAR_TR_BTN}}
    <button type="button" class="mini-toolbar__print" onclick="window.print()">{{TOOLBAR_PRINT_BTN}}</button>
  </div>

  <div class="view-dash">
    <div class="dash-scroll">
      {{DASH_COVER}}
      {{DASH_TABS}}
      {{DASH_PANEL_PERSONAS}}
      {{DASH_PANEL_ACTIONS}}
    </div>
  </div>

  <div class="view-a4">
    <div class="a4-scroll">
      {{A4_COVER_PAGE}}
      {{A4_BODY_PAGE}}
    </div>
  </div>

  <script>{{INLINE_SCRIPT}}</script>
</body>
</html>
