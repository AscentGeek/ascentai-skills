<script id="ds-focus-js">(function(){
/* method-v5 · 표의 묶음 행을 누르면 같은 카드의 꺾은선에서 그 묶음 선과 구성 키워드 선만 강조 · 다시 누르면 해제 */
function focus(card,g){
  var cur=card.getAttribute('data-focus');var on=cur!==g;
  card.querySelectorAll('.ds-chart').forEach(function(ch){
    var hit=false;ch.querySelectorAll('polyline[data-g]').forEach(function(l){if(l.getAttribute('data-g')===g)hit=true;});
    if(!hit&&on)return;
    ch.classList.toggle('has-focus',on);
    ch.querySelectorAll('polyline').forEach(function(l){l.classList.toggle('is-focus',on&&l.getAttribute('data-g')===g);});
    var lg=ch.previousElementSibling;if(lg&&lg.classList.contains('ds-legend')){lg.classList.toggle('has-focus',on);
      lg.querySelectorAll('.ds-legend__i').forEach(function(it){it.classList.toggle('is-focus',on&&it.getAttribute('data-g')===g);});}
  });
  card.querySelectorAll('tr[data-g]').forEach(function(tr){tr.classList.toggle('is-focus',on&&tr.getAttribute('data-g')===g&&!tr.hasAttribute('data-parent'));});
  if(on)card.setAttribute('data-focus',g);else card.removeAttribute('data-focus');
}
document.addEventListener('click',function(e){
  var tr=e.target.closest('tr[data-g]');if(!tr||e.target.closest('a'))return;
  if(tr.hasAttribute('data-parent'))return;
  var card=tr.closest('.dash-card__body, .page-body');if(!card)return;
  if(!card.querySelector('polyline[data-g]'))return;
  focus(card,tr.getAttribute('data-g'));
});
})();</script>

<script id="ds-info-js">(function(){
